[package]
name = "gray-slack"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
description = "Standalone Slack transport and setup for gray"

[lib]
name = "gray_slack"
path = "src/lib.rs"

[[bin]]
name = "gray-slack"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart", "stream"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
futures-util = "0.3"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-webpki-roots", "url"] }

[dev-dependencies]
tempfile = "3"
